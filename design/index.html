<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>design • sparkskye</title>
  <link rel="icon" href="/public/img/favicon.png" />
  <link rel="stylesheet" href="/hive-resources/css/hive.css" />
</head>
<body class="theme-design design-page">
  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand__logo" src="/public/img/favicon.png" alt="Sparkskye" />
      <span class="brand__name">SPARKSKYE</span>
    </a>
    <nav class="topnav">
      <div class="topnav__links">
        <a class="topnav__btn" style="--item-color:#598ffe" href="/animations/">ANIMATIONS</a>
        <a class="topnav__btn" style="--item-color:#f0593a" href="/editing/">EDITING</a>
        <a class="topnav__btn is-active" style="--item-color:#894bdd" href="/design/">DESIGN</a>
        <a class="topnav__btn" style="--item-color:#fbbc42" href="/art/">ART</a>
        <a class="topnav__btn" style="--item-color:#00aaff" href="/hive-resources/">HIVE RESOURCES</a>
      </div>
    </nav>
  </header>

  <main class="page page--wide">
    <section class="hero">
      <h1 class="hero__title">DESIGN</h1>
      <p class="hero__sub">thumbnails, profiles, banners, and other graphic design work</p>
    </section>

    <section class="panel" id="filtersPanel">
      <div class="panel__row panel__row--center">
        <div class="panel__label">TAGS</div>
        <div class="chips" id="categoryChips"></div>
      </div>
      <div class="panel__row panel__row--search">
        <input id="searchInput" class="search" placeholder="search designs..." autocomplete="off" />
        <div class="count" id="countLabel">0 shown</div>
      </div>
    </section>

    <section class="grid" id="grid"></section>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" id="modalBackdrop"></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-label="Design preview">
      <button class="modal__close" id="modalClose" aria-label="Close">X</button>
      <div class="modal__viewer modal__viewer--media" id="modalViewer">
        <div class="viewer__loading" id="modalLoading">Loading...</div>
      </div>
      <div class="modal__meta">
        <div class="modal__name" id="modalName">—</div>
        <div class="modal__path" id="modalPath">—</div>
        <div class="modal__actions" id="modalActions"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/hive-resources/js/design.js"></script>
</body>
</html>
